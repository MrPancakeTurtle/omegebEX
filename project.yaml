title: 100% Route (1.9 DLC) 
version: 1.0.0

route:
  use: ./main.yaml

config:
- use: sobolews/celer-presets/botw/full.yaml
- use: ./100.yaml
- use: ./locations.yaml
- icons:
    malice: https://icons.pistonite.org/icon/misc.apple.none.f24c99.ffc0fa.f24c99.ffc0fa.f24c99.ffc0fa.png
    purple: https://icons.pistonite.org/icon/misc.apple.none.613b75.b96cf5.613b75.b96cf5.613b75.b96cf5.png
    horse: https://icons.pistonite.org/icon/misc.horse.none.69a2d5.c1fefe.8c5e28.ffffb5.8c5e28.ffffb5.png
- tags:
    custom-item:
      color: purple
      split-type: Extra Splits
    dungeon-entry:
      color: orange
      split-type: Extra Splits
    dungeon-complete:
      color: purple
      split-type: Extra Splits
- splits:
    - dungeon-entry
    - dungeon-complete
    - custom-item
  plugins:
  - use: link
  - use: split-format
    with:
      Shrines: ".var(counter-korok) - .prop(text)"
  - use: variables
    with:
      init:
        with-dlc: 1
        great-plateau-count: 2
        map-pct-items-total: 1227
      split-types:
        - Shrines
        - Towers
        - UserDefined
      expose: true
- presets:
    _Snap:
      Quest:
        text: $(0)
        icon: camera
        icon-priority: 2
        comment: SNAP for quest
